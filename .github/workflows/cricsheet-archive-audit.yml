name: Cricsheet archive audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the reviewed audit utility
        uses: actions/checkout@v4
        with:
          ref: docs/six-sport-data-collection-blueprint

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run isolated Cricsheet archive audit
        id: audit
        continue-on-error: true
        run: python scripts/cricsheet-archive-audit.py

      - name: Upload aggregate audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cricsheet-archive-audit-report
          path: cricsheet-audit-output/cricsheet-audit-report.json
          if-no-files-found: warn
          retention-days: 14

      - name: Print audit outcome
        if: always()
        run: |
          if [ -f cricsheet-audit-output/cricsheet-audit-report.json ]; then
            python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("cricsheet-audit-output/cricsheet-audit-report.json").read_text())
          for item in report.get("reports", []):
              print(f"{item.get('competition')}: {item.get('status')}")
              if item.get("error"):
                  print(f"  {item['error']}")
          PY
          else
            echo "No aggregate report was produced."
          fi
