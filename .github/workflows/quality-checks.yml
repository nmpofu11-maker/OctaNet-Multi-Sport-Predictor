name: Quality Checks

on:
  pull_request:
  push:
    branches:
      - main
      - fix/purge-synthetic-default-state

permissions:
  contents: read

jobs:
  verify:
    name: Test, typecheck, and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: npm test
      - name: TypeScript check
        run: npm run lint
      - name: Production build
        run: npm run build
